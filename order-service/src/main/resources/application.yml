server:
  port: 8082

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:order_db}
    username: ${DB_USER:ims}
    password: ${DB_PASSWORD:ims}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BROKER:localhost:9092}
  cloud:
    openfeign:
      # Off: the explicit @CircuitBreaker/@Retry on InventoryClientAdapter is the single
      # resilience layer. Feign's own wrapper would add a second, separately-configured
      # breaker around the same calls.
      circuitbreaker:
        enabled: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

resilience4j:
  # Lower aspect order = outer. The default is the reverse (retry outermost), which lets the
  # inner breaker's fallback convert the first failure before retry can make a second attempt.
  circuitbreaker:
    circuit-breaker-aspect-order: 1
    instances:
      inventoryService:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-rate-threshold: 100
        slow-call-duration-threshold: 3s
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        ignore-exceptions:
          - com.ims.order.exception.InsufficientStockException
          - com.ims.order.exception.ProductNotFoundException
  retry:
    retry-aspect-order: 2
    instances:
      inventoryService:
        max-attempts: 3
        wait-duration: 300ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        # Only business rejections. CallNotPermittedException and
        # InventoryServiceUnavailableException both originate in the outer breaker layer, so
        # the retry aspect never sees them; listing them here used to suppress every retry.
        ignore-exceptions:
          - com.ims.order.exception.InsufficientStockException
          - com.ims.order.exception.ProductNotFoundException

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

logging:
  level:
    com.ims.order: INFO
