spring:
  datasource:
    url: jdbc:h2:mem:order_test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: create-drop
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
  cloud:
    openfeign:
      circuitbreaker:
        enabled: false

# Off for the whole test module. The relay claims rows with a native Postgres query
# (FOR UPDATE SKIP LOCKED) that H2 cannot parse, so a background thread firing it once a second
# would break every @SpringBootTest here. OutboxRelayTest covers the relay's logic with a mocked
# repository, OutboxRelayTransactionIntegrationTest switches the bean back on to check it really
# runs in a transaction, and OutboxRelayPostgresKafkaIntegrationTest is the only test that runs the
# real SQL - against real Postgres.
outbox:
  relay:
    enabled: false

eureka:
  client:
    enabled: false
