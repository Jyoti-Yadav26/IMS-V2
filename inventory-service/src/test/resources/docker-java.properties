# Pins the Docker Engine API version used by Testcontainers. Without this, no container starts
# on Docker Engine 29.
#
# Testcontainers 1.19.7 (the version the Spring Boot 3.2.5 BOM manages) does not negotiate an API
# version. DockerClientProviderStrategy.getClientForConfig hard-codes a fallback:
#
#     if (config.getApiVersion() == RemoteApiVersion.UNKNOWN_VERSION) {
#         builder.withApiVersion(RemoteApiVersion.VERSION_1_32);
#     }
#
# so every call goes to /v1.32/... . Docker Engine 29 raised its MINIMUM supported API version to
# 1.40 and answers those with HTTP 400, which Testcontainers reports as "Could not find a valid
# Docker environment" - and any @Testcontainers(disabledWithoutDocker = true) class is then
# silently skipped rather than failed.
#
# Setting api.version here makes getApiVersion() something other than UNKNOWN_VERSION, so the 1.32
# fallback never fires. DefaultDockerClientConfig.loadIncludedDockerProperties reads this file from
# the classpath root, which is why it lives in src/test/resources. 1.44 is the ceiling: it is the
# highest RemoteApiVersion constant the shaded docker-java 3.3.6 knows about, and the floor is the
# engine's minimum of 1.40.
#
# This is test-scoped configuration, not a dependency change, so the version freeze in CLAUDE.md
# rule 7 is untouched. It can be deleted once the managed Testcontainers version moves past this.
api.version=1.44
